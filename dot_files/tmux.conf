set -g prefix C-a
unbind C-b
bind C-a send-prefix

unbind =
bind = split-window -h
bind - split-window -v
bind | choose-buffer

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'M-o' select-pane -t :.+
bind-key -n 'M-h' select-pane -L
bind-key -n 'M-j' select-pane -D
bind-key -n 'M-k' select-pane -U
bind-key -n 'M-l' select-pane -R

bind r source-file ~/.tmux.conf \; display "Reloaded"

set -g mouse on
set-window-option -g mode-keys vi
set -g base-index 1

# pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour109
set -g pane-border-lines heavy

# status bar
set -g status-style "bg=#3c3836 fg=#ebdbb2"
set -g status-left "#[bg=#d79921 fg=#282828 bold] #S #[default] #{?client_prefix,#[bg=#cc241d fg=#ebdbb2 bold] PREFIX ,}"
set -g status-right "#[fg=#a89984] %H:%M %d-%b "
set -g status-right-length 20
set -g window-status-format "#[fg=#a89984] #I:#W "
set -g window-status-current-format "#[bg=#504945 fg=#ebdbb2 bold] #I:#W "
set -g status-justify left
set -g status-position bottom
